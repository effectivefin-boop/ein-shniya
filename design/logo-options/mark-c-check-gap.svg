<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- C: Soft clipboard/frame + gap tick — checkup literal without medical cross -->
  <rect x="12" y="10" width="40" height="46" rx="6" stroke="#0d5c63" stroke-width="2.5" fill="#0d5c63" fill-opacity="0.07"/>
  <path d="M24 10 V8 A8 8 0 0 1 40 8 V10" stroke="#0d5c63" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- two teal lines as 'readings' -->
  <path d="M22 28 H42" stroke="#0d5c63" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M22 36 H36" stroke="#0d5c63" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <!-- coral gap stroke where a third reading would be -->
  <path d="M22 44 H30" stroke="#e07a5f" stroke-width="3" stroke-linecap="round"/>
  <path d="M34 44 H42" stroke="#0d5c63" stroke-width="2.2" stroke-linecap="round" opacity="0.35" stroke-dasharray="2 3"/>
</svg>
